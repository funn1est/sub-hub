name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Rust and Worker validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1 # Keep in sync with rust-toolchain.toml.
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Run formatting gate
        run: cargo fmt --all -- --check

      - name: Run Clippy gate
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Check the conversion core for Wasm
        run: cargo check --locked -p sub-hub-conversion --target wasm32-unknown-unknown

      - name: Check the HTTP module for Wasm
        run: cargo check --locked -p sub-hub-http --target wasm32-unknown-unknown

      - name: Install Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned Worker build tool
        run: cargo install worker-build --version 0.8.5 --locked

      - name: Install pinned Miniflare dependencies
        working-directory: crates/sub-hub-worker
        run: corepack pnpm install --frozen-lockfile

      - name: Build the Cloudflare Worker
        working-directory: crates/sub-hub-worker
        run: worker-build --release

      - name: Run workerd host conformance tests
        working-directory: crates/sub-hub-worker
        run: corepack pnpm run test:host
