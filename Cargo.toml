[workspace]
members = [
    "crates/sub-hub-conversion",
    "crates/sub-hub-http",
    "crates/sub-hub-native",
    "crates/sub-hub-worker",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.97.1"

[workspace.dependencies]
base64 = "0.22.1"
axum = "=0.8.9"
futures = "=0.3.31"
http = "=1.3.1"
http-body-util = "=0.1.3"
proptest = { version = "1.7.0", default-features = false, features = ["std"] }
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = "2.6.1"
serde_yaml_ng = "=0.10.0"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = "=0.5.3"
unicode-normalization = "=0.1.25"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["emoji", "general-category"] }
unicode-segmentation = "=1.13.3"
url = "=2.5.4"
uuid = "1.16.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
