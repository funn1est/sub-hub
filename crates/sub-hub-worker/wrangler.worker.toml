# Conversion Service only (`pnpm run deploy -- --layout worker`).
# Same Worker name as wrangler.toml; no Console assets.
name = "sub-hub"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-13"
compatibility_flags = [
  "global_fetch_strictly_public",
]

# Errors only. Invocation logs include the request URL; /sub query strings
# commonly contain credentials.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[build]
command = "worker-build --release"

[build.upload]
dir = "build/worker"
format = "modules"
main = "./shim.mjs"

[[build.upload.rules]]
globs = ["**/*.wasm"]
type = "CompiledWasm"
