name: Mihomo validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mihomo-validation:
    name: Official Mihomo ${{ matrix.version }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v1.19.27
            sha256: 34b4c5bc0c176eebd298f6624aa23ea41985a2c54efb04eb0e9c4542e45190ee
          - version: v1.19.29
            sha256: 1a8520cfe425441eba3eba8623b27b985020031243fe1ecaa1af2b92358a03f9
    env:
      CARGO_TERM_COLOR: always
      SUB_HUB_REQUIRE_MIHOMO: "1"
      SUB_HUB_REQUIRE_ACL4SSR_CORPUS: "1"
      SUB_HUB_MIHOMO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1 # Keep in sync with rust-toolchain.toml.

      - name: Checkout the pinned ACL4SSR corpus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $commit = '2fc7487be9ec0a0fcd7c91db319787d7b35a195d'
          $corpus = Join-Path $env:RUNNER_TEMP 'acl4ssr-corpus'
          git init $corpus
          git -C $corpus config core.autocrlf false
          git -C $corpus remote add origin https://github.com/ACL4SSR/ACL4SSR.git
          git -C $corpus fetch --depth=1 --no-tags origin $commit
          git -C $corpus checkout --detach FETCH_HEAD

          $actual = (git -C $corpus rev-parse --verify 'HEAD^{commit}').Trim()
          if ($actual -cne $commit) {
            throw 'Pinned ACL4SSR checkout identity mismatch.'
          }

          Add-Content `
            -LiteralPath $env:GITHUB_ENV `
            -Value "SUB_HUB_ACL4SSR_CORPUS_DIR=$corpus" `
            -Encoding utf8

      - name: Download and verify Mihomo ${{ matrix.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = '${{ matrix.version }}'
          $asset = "mihomo-windows-amd64-$version.zip"
          $expected = '${{ matrix.sha256 }}'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $extract = Join-Path $env:RUNNER_TEMP "mihomo-$version"
          $url = "https://github.com/MetaCubeX/mihomo/releases/download/$version/$asset"

          Invoke-WebRequest -Uri $url -OutFile $archive

          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) {
            throw 'Pinned Mihomo archive checksum mismatch.'
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extract

          $executables = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter '*.exe')
          if ($executables.Count -ne 1) {
            throw 'Pinned Mihomo archive layout was unexpected.'
          }

          Add-Content `
            -LiteralPath $env:GITHUB_ENV `
            -Value "SUB_HUB_MIHOMO_BIN=$($executables[0].FullName)" `
            -Encoding utf8

      - name: Run corpus and official Mihomo acceptance tests
        shell: pwsh
        run: >-
          cargo test --locked -p sub-hub-conversion
          --test acl4ssr_corpus
          --test mihomo_validation
