name = "sub-hub"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-13"
compatibility_flags = [
  "global_fetch_strictly_public",
]

# Errors only. Invocation logs include the request URL; /sub query strings
# commonly contain credentials.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[build]
command = "worker-build --release"

[build.upload]
dir = "build/worker"
format = "modules"
main = "./shim.mjs"

[[build.upload.rules]]
globs = ["**/*.wasm"]
type = "CompiledWasm"

# Default layout `all`: same-origin Web Console (Native
# `SUB_HUB_CONSOLE_ROOT`). Build `apps/console` before `wrangler deploy`
# / `wrangler dev`; `[build]` only compiles Wasm. `/version` and `/sub`
# always hit the Worker. Conversion-only publish: wrangler.worker.toml.
[assets]
directory = "../../apps/console/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/version", "/sub", "/sub/*"]
