name: Mihomo validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mihomo-validation:
    name: Official Mihomo v1.19.27
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      SUB_HUB_REQUIRE_MIHOMO: "1"
      SUB_HUB_REQUIRE_ACL4SSR_CORPUS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: jdx/mise-action@v4
        with:
          install_args: rust

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Checkout the pinned ACL4SSR corpus
        run: |
          set -eu
          commit='2fc7487be9ec0a0fcd7c91db319787d7b35a195d'
          corpus="${RUNNER_TEMP}/acl4ssr-corpus"
          git init "$corpus"
          git -C "$corpus" config core.autocrlf false
          git -C "$corpus" remote add origin https://github.com/ACL4SSR/ACL4SSR.git
          git -C "$corpus" fetch --depth=1 --no-tags origin "$commit"
          git -C "$corpus" checkout --detach FETCH_HEAD
          actual="$(git -C "$corpus" rev-parse --verify 'HEAD^{commit}')"
          test "$actual" = "$commit"
          echo "SUB_HUB_ACL4SSR_CORPUS_DIR=$corpus" >> "$GITHUB_ENV"

      - name: Download and verify Mihomo v1.19.27
        run: |
          set -eu
          asset='mihomo-linux-amd64-v1.19.27.gz'
          expected='fb3e34c55844f389ff54679e5a3aec331d5ec38006c20f8dcc476fb47768a58f'
          archive="${RUNNER_TEMP}/${asset}"
          extract="${RUNNER_TEMP}/mihomo-v1.19.27"
          url="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/${asset}"
          curl -fsSL "$url" -o "$archive"
          echo "${expected}  ${archive}" | sha256sum -c -
          mkdir -p "$extract"
          gzip -dc "$archive" > "${extract}/mihomo"
          chmod +x "${extract}/mihomo"
          echo "SUB_HUB_MIHOMO_BIN=${extract}/mihomo" >> "$GITHUB_ENV"

      - name: Run corpus and official Mihomo acceptance tests
        run: >-
          cargo test --locked -p sub-hub-conversion
          --test acl4ssr_corpus
          --test mihomo_validation
