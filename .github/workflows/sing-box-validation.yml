name: sing-box validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sing-box-validation:
    name: Official sing-box 1.13.14
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      SUB_HUB_REQUIRE_SING_BOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: 1.97.1 # Keep in sync with rust-toolchain.toml.

      - name: Download and verify sing-box 1.13.14
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $asset = 'sing-box-1.13.14-windows-amd64.zip'
          $expected = 'f580782c6dd10f7691c66cea1d7c421813c5fbf7e305d1ee7ce0c3a40d196341'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $extract = Join-Path $env:RUNNER_TEMP 'sing-box-1.13.14'
          $url = "https://github.com/SagerNet/sing-box/releases/download/v1.13.14/$asset"

          Invoke-WebRequest -Uri $url -OutFile $archive

          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) {
            throw 'Pinned sing-box archive checksum mismatch.'
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extract

          $executables = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'sing-box.exe')
          if ($executables.Count -ne 1) {
            throw 'Pinned sing-box archive layout was unexpected.'
          }

          Add-Content `
            -LiteralPath $env:GITHUB_ENV `
            -Value "SUB_HUB_SING_BOX_BIN=$($executables[0].FullName)" `
            -Encoding utf8

      - name: Run official sing-box acceptance tests
        shell: pwsh
        run: cargo test --locked -p sub-hub-conversion --test singbox_validation
