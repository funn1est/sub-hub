name: Native release smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-release-smoke:
    name: Native release process smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: jdx/mise-action@v4
        with:
          install_args: rust

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the native release executable
        run: cargo build --locked --release -p sub-hub-native

      - name: Run the process-level conversion smoke test
        run: |
          set -eu
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          export SUB_HUB_BIND="127.0.0.1:${port}"
          unset SUB_HUB_SELF_HOSTS
          ./target/release/sub-hub-native &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          version=""
          i=0
          while [ "$i" -lt 100 ]; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'native backend exited before it became ready' >&2
              exit 1
            fi
            if curl -fsS --max-time 1 "http://127.0.0.1:${port}/version" -o version.txt; then
              version="$(cat version.txt)"
              if [ "$version" = 'sub-hub v0.1.0 backend' ]; then
                break
              fi
            fi
            version=""
            i=$((i + 1))
            sleep 0.1
          done
          if [ "$version" != 'sub-hub v0.1.0 backend' ]; then
            echo 'native backend did not return the expected version response' >&2
            exit 1
          fi

          export SMOKE_PORT="$port"
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import urllib.parse

          port = os.environ["SMOKE_PORT"]
          source = "vless://01234567-89ab-cdef-0123-456789abcdef@example.com:443#Alpha"
          checks = {
              "clash": (
                  "mode: rule\n",
                  "- name: Alpha\n  type: vless\n  server: example.com\n  port: 443\n",
                  "  uuid: 01234567-89ab-cdef-0123-456789abcdef\n",
                  "rules:\n- MATCH,PROXY\n",
              ),
              "mihomo": (
                  "- name: Alpha\n  type: vless\n",
                  "  uuid: 01234567-89ab-cdef-0123-456789abcdef\n",
              ),
              "quanx": (
                  "vless=example.com:443, method=none, password=01234567-89ab-cdef-0123-456789abcdef, udp-relay=true, fast-open=false, tag=Alpha\n",
                  "final, PROXY\n",
              ),
              "singbox": (
                  '"type": "vless"',
                  '"tag": "Alpha"',
                  '"uuid": "01234567-89ab-cdef-0123-456789abcdef"',
              ),
              "loon": (
                  'Alpha = VLESS,example.com,443,"01234567-89ab-cdef-0123-456789abcdef",transport=tcp,over-tls=false,udp=true\n',
                  "FINAL,PROXY\n",
              ),
              "egern": (
                  "    name: Alpha\n",
                  "    user_id: 01234567-89ab-cdef-0123-456789abcdef\n",
                  "- vless:\n",
              ),
          }

          for target, fragments in checks.items():
              query = urllib.parse.urlencode({"target": target, "url": source})
              url = f"http://127.0.0.1:{port}/sub?{query}"
              result = subprocess.run(
                  ["curl", "-fsS", "--max-time", "5", url],
                  check=False,
                  capture_output=True,
              )
              if result.returncode != 0:
                  sys.stderr.write(
                      f"native smoke {target} curl failed: {result.stderr.decode()}\n"
                  )
                  raise SystemExit(1)
              body = result.stdout.decode("utf-8")
              missing = [fragment for fragment in fragments if fragment not in body]
              if missing:
                  sys.stderr.write(
                      f"native backend returned unexpected {target} output; missing {missing!r}\n"
                  )
                  raise SystemExit(1)

          print(
              "Native release smoke passed: /version and direct VLESS -> "
              "clash/mihomo/quanx/singbox/loon/egern."
          )
          PY
