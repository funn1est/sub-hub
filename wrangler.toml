# Deploy-to-Cloudflare button contract when the clone root is this
# repository (root `package.json` `build` / `deploy`). Layout `all`:
# Conversion plus same-origin Console.
# Workers Builds (Dashboard root `crates/sub-hub-worker`) uses that crate
# wrangler.toml. Local maintainer publish stays
# `cd crates/sub-hub-worker && pnpm run deploy`.
# Do not add Cloudflare account fields or KV / D1 / R2 / Secrets Store
# bindings.

name = "sub-hub"
main = "crates/sub-hub-worker/build/worker/shim.mjs"
compatibility_date = "2026-09-03"
compatibility_flags = [
  "global_fetch_strictly_public",
]

# Errors only. Invocation logs include the request URL; /sub query strings
# commonly contain credentials.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[build]
command = "cd crates/sub-hub-worker && worker-build --release"

[assets]
directory = "apps/console/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/version", "/sub", "/sub/*"]
