name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Rust and Worker validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchains
        uses: jdx/mise-action@v4

      - name: Run formatting gate
        run: cargo fmt --all -- --check

      - name: Run Clippy gate
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Check the conversion core for Wasm
        run: cargo check --locked -p sub-hub-conversion --target wasm32-unknown-unknown

      - name: Check the HTTP module for Wasm
        run: cargo check --locked -p sub-hub-http --target wasm32-unknown-unknown

      - name: Install pinned Worker build tool
        run: cargo install worker-build --version 0.8.5 --locked

      - name: Install pinned Miniflare dependencies
        working-directory: crates/sub-hub-worker
        run: pnpm install --frozen-lockfile

      - name: Build the Cloudflare Worker
        working-directory: crates/sub-hub-worker
        run: worker-build --release

      - name: Run workerd host conformance tests
        working-directory: crates/sub-hub-worker
        run: pnpm run test:host

  console:
    name: Web Console
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/console

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js and pnpm
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Install Console dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Console tests
        run: pnpm test

      - name: Run Console lint
        run: pnpm run lint

      - name: Build Console
        run: pnpm run build
