name: sing-box validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sing-box-validation:
    name: Official sing-box 1.13.14
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      SUB_HUB_REQUIRE_SING_BOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: jdx/mise-action@v4
        with:
          install_args: rust

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Download and verify sing-box 1.13.14
        run: |
          set -eu
          asset='sing-box-1.13.14-linux-amd64.tar.gz'
          expected='f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697'
          archive="${RUNNER_TEMP}/${asset}"
          extract="${RUNNER_TEMP}/sing-box-1.13.14"
          url="https://github.com/SagerNet/sing-box/releases/download/v1.13.14/${asset}"
          curl -fsSL "$url" -o "$archive"
          echo "${expected}  ${archive}" | sha256sum -c -
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          bin="${extract}/sing-box-1.13.14-linux-amd64/sing-box"
          test -f "$bin"
          chmod +x "$bin"
          echo "SUB_HUB_SING_BOX_BIN=$bin" >> "$GITHUB_ENV"

      - name: Run official sing-box acceptance tests
        run: cargo test --locked -p sub-hub-conversion --test singbox_validation
